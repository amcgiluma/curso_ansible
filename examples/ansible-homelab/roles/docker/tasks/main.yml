---
- name: Instalar paquetes base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Instalar Docker Engine y Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
  notify: Reiniciar Docker

- name: Asegurar servicio Docker activo
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Añadir usuarios al grupo docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users | default([]) }}"

- name: Comprobar version de Docker
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Mostrar version de Docker
  ansible.builtin.debug:
    var: docker_version.stdout
